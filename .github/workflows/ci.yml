name: CI

# Stage 1 (design note D2, D6, D11, D12, D13), stage 2 (Core tests with PHP,
# Composer and a real FloCMS project):
#  - static-qt:   Qt built statically from source (build_static_qt.py),
#                 cached; the first build takes hours and resumes from the
#                 cache when a run ends before it is done
#  - release:     tests against Qt's own shared build, then the release:
#                 Studio as one program with Qt inside (Studio.exe, or one
#                 FloCMS Studio.app), smoke and memory tests, the Windows
#                 installer (WiX) and the macOS .dmg
#  - linux:       build and tests on Ubuntu with Qt 6.12 (shared), label
#                 checks, screenshots of every demo screen (artifact)
#  - sanitizers:  AddressSanitizer + UndefinedBehaviorSanitizer, Linux, macOS
#  - clang-tidy:  static analysis of our own sources
#
# Results that matter are printed as ::notice:: / ::error:: annotations,
# because job logs can't always be read from outside GitHub.

on:
  pull_request:
    paths-ignore:
      - "prototypes/**"
      - ".github/workflows/rtl-check.yml"
  push:
    branches: [main]
    paths-ignore:
      - "prototypes/**"
      - ".github/workflows/rtl-check.yml"
  # Weekly on main: the static Qt cache (unused for 7 days, GitHub drops
  # it) stays ready for a release
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  # The release workflow (release.yml) runs all of CI first and signs what
  # the release job built
  workflow_call:

permissions:
  contents: read

env:
  QT_VERSION: "6.12.0"
  # A Windows GUI program sends warnings to the debugger, not stderr.
  QT_FORCE_STDERR_LOGGING: "1"

jobs:
  static-qt:
    name: static Qt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A job ends after 6 hours: the build stops before, saves what it has,
    # and the next run goes on from there
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: macos-15
    defaults:
      run:
        shell: bash
    env:
      # Short paths: Qt's sources are deep, and Windows paths are short
      STATIC_QT: ${{ startsWith(matrix.os, 'windows') && 'C:/qs' || '/Users/runner/qs' }}
      STATIC_WORK: ${{ startsWith(matrix.os, 'windows') && 'C:/qw' || '/Users/runner/qw' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools
        run: python -m pip install -q ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The newest save for this Qt version and this build script
      - id: key
        run: echo "key=static-qt-${{ runner.os }}-${QT_VERSION}-${{ hashFiles('.github/scripts/build_static_qt.py') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATIC_QT }}
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.key.outputs.key }}-

      - id: state
        run: |
          if [ -f "$STATIC_QT/share/flostudio/qt-build.json" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "::notice::static Qt $QT_VERSION: from the cache ($(du -sh "$STATIC_QT" | cut -f1))"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static Qt
        if: steps.state.outputs.done != 'true'
        timeout-minutes: 320
        run: |
          universal=()
          if [ "$RUNNER_OS" = "macOS" ]; then universal=(--universal); fi
          python .github/scripts/build_static_qt.py --version "$QT_VERSION" --prefix "$STATIC_QT" --work "$STATIC_WORK" "${universal[@]}"

      # Also after a failure or the time limit: the next run goes on from
      # the modules already built
      - uses: actions/cache/save@v4
        if: always() && steps.state.outputs.done != 'true'
        with:
          path: ${{ env.STATIC_QT }}
          key: ${{ steps.key.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    name: release (${{ matrix.os }})
    needs: static-qt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: macos-15
    defaults:
      run:
        shell: bash
    env:
      STATIC_QT: ${{ startsWith(matrix.os, 'windows') && 'C:/qs' || '/Users/runner/qs' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools
        run: python -m pip install -q ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # aqtinstall can't find Qt 6.12 for Windows yet (new repository
      # layout), so a small script reads the official repository directly.
      - name: Install Qt 6.12 (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          python .github/scripts/install_qt_windows.py "$QT_VERSION" win64_msvc2022_64 "$RUNNER_TEMP/Qt" 2>&1 | tee qt.log \
            || { tail -5 qt.log | sed 's/^/::error::/'; exit 1; }
          echo "QT_DIR=$(tail -1 qt.log | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Install Qt 6.12 (macOS, universal)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
          setup-python: false

      - name: Build Studio
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra=("-DCMAKE_PREFIX_PATH=$QT_DIR")
          else
            # The same minimum macOS as Qt itself, not the runner's SDK.
            minos=$(otool -l "$QT_ROOT_DIR/lib/QtCore.framework/QtCore" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "::notice::Qt $QT_VERSION needs macOS $minos or newer"
            echo "MACOS_MIN=$minos" >> "$GITHUB_ENV"
            extra=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=$minos")
          fi
          { cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${extra[@]}" \
            && cmake --build build; } > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            grep -iE "error|undefined|cannot|not found|failed" build.log | head -25 | sed 's/^/::error::/'
          fi
          exit $status

      # PHP and Composer for the Core tests (finding the tools, running
      # commands) and the real FloCMS project below.
      - name: PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, fileinfo, gd, openssl, curl, pdo, pdo_sqlite, pdo_mysql
          tools: composer
          coverage: none

      - name: Tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="$QT_DIR/bin:$PATH"; fi
          .github/scripts/run_tests.sh build

      # Core against a site made with `composer create-project hostkurd/flocms`
      # (SQLite): doctor, migrations, and php flo serve started and stopped
      # with its php -S child.
      - name: Real FloCMS project
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="$QT_DIR/bin:$PATH"; fi
          .github/scripts/real_project.sh "$RUNNER_TEMP/site" sqlite
          FLOSTUDIO_REAL_PROJECT="$RUNNER_TEMP/site" FLOSTUDIO_WIZARD_TESTS=1 .github/scripts/run_tests.sh build -R "tst_realproject|tst_studio" -V

      # The release: Studio again, against the static Qt (static-qt), as one
      # program with Qt, our libraries and the C++ runtime inside. The
      # tests above ran against Qt's shared build; the smoke and memory
      # tests below run this one.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATIC_QT }}
          key: static-qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ hashFiles('.github/scripts/build_static_qt.py') }}-none
          restore-keys: static-qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ hashFiles('.github/scripts/build_static_qt.py') }}-

      - name: Build Studio (static)
        run: |
          set +e
          if [ ! -f "$STATIC_QT/share/flostudio/qt-build.json" ]; then
            echo "::error::the static Qt isn't finished yet (static-qt job): run CI again, it goes on from where it stopped"
            exit 1
          fi
          # Only the static Qt: not the shared one the tests used
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH Qt6_DIR QT_ROOT_DIR CMAKE_PREFIX_PATH
          extra=()
          # The same minimum macOS as Qt's own build (release notes say it)
          if [ "$RUNNER_OS" = "macOS" ]; then extra=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_MIN"); fi
          { cmake -S . -B build-static -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DFLOSTUDIO_SHARED_LIBS=OFF -DFLOSTUDIO_BUILD_TESTS=OFF \
              -DCMAKE_TOOLCHAIN_FILE="$STATIC_QT/lib/cmake/Qt6/qt.toolchain.cmake" "${extra[@]}" \
            && cmake --build build-static; } > build-static.log 2>&1
          status=$?
          cat build-static.log
          if [ $status -ne 0 ]; then
            grep -iE "error|undefined|unresolved|cannot|not found|failed" build-static.log | head -25 | sed 's/^/::error::/'
          fi
          exit $status

      # What ships: the program, LICENSE.txt and THIRD-PARTY-NOTICES.txt
      # (next to Studio.exe on Windows, inside the app on macOS)
      - name: Collect Studio
        run: |
          fail() { echo "::error::$1"; exit 1; }
          mkdir -p dist
          notices=(--qt-version "$QT_VERSION" --commit "$GITHUB_SHA" --static
                   --attributions "$STATIC_QT/share/flostudio/qt-attributions.json"
                   --qtkeychain build-static/_deps/qtkeychain-src/COPYING)
          if [ "$RUNNER_OS" = "Windows" ]; then
            app=dist/FloCMS-Studio
            mkdir -p "$app"
            cp build-static/bin/Studio.exe "$app/" || fail "no Studio.exe"
            python tools/make_notices.py "$app/THIRD-PARTY-NOTICES.txt" "${notices[@]}" || fail "notices"
            cp LICENSE "$app/LICENSE.txt"
            echo "STUDIO=$app/Studio.exe" >> "$GITHUB_ENV"
          else
            app="dist/FloCMS Studio.app"
            cp -R "build-static/bin/FloCMS Studio.app" dist/ || fail "could not copy the app bundle"
            python tools/make_notices.py "$app/Contents/Resources/THIRD-PARTY-NOTICES.txt" "${notices[@]}" || fail "notices"
            cp LICENSE "$app/Contents/Resources/LICENSE.txt"
            # Only macOS's own rpaths: drop the build folder's
            for rp in $(otool -l "$app/Contents/MacOS/FloCMS Studio" | awk '/cmd LC_RPATH/{getline; getline; print $2}' | sort -u); do
              install_name_tool -delete_rpath "$rp" "$app/Contents/MacOS/FloCMS Studio" || fail "could not remove rpath $rp"
            done
            # Ad-hoc signature over the whole bundle, so Apple Silicon runs it.
            codesign --force --deep --sign - "$app" || fail "codesign failed"
            echo "STUDIO=$app/Contents/MacOS/FloCMS Studio" >> "$GITHUB_ENV"
            # Beside the app in the disk image too
            cp "$app/Contents/Resources/THIRD-PARTY-NOTICES.txt" "$app/Contents/Resources/LICENSE.txt" dist/
          fi
          echo "APP_DIR=$app" >> "$GITHUB_ENV"
          # The static Qt's folders are built into Qt as places to look for
          # plugins and QML: away with them (and the build), so the tests
          # below can only use what ships
          mv "$STATIC_QT" "$STATIC_QT.away"
          mv build-static build-static.away

      - name: Check the build
        run: |
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH
          echo "::notice::$("$STUDIO" --version | tr -d '\r' | tr '\n' ';')"
          version=$("$STUDIO" --version | tr -d '\r' | head -1 | awk '{print $3}')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          files=$(find "$APP_DIR" -type f | wc -l | tr -d ' ')
          size=$(du -sk "$APP_DIR" | cut -f1)
          echo "::notice::$(basename "$APP_DIR"): $files files, $size KiB"
          "$STUDIO" --version | grep -q "^Qt .*(static)" || { echo "::error::this Studio doesn't have Qt inside"; exit 1; }
          "$STUDIO" --version | grep -q "^FloStudio libraries: static" || { echo "::error::the FloStudio libraries aren't inside"; exit 1; }
          # HTTPS for downloads comes from a TLS plugin: it must be inside
          # ("cert-only" reads certificates but can't connect)
          tls=$("$STUDIO" --version | tr -d '\r' | sed -n 's/^TLS: //p')
          echo "::notice::TLS backends: $tls"
          if [ -z "$(echo "$tls" | tr ',' '\n' | tr -d ' ' | grep -vxE 'none|cert-only|')" ]; then
            echo "::error::no TLS backend inside Studio: downloads would fail"; exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Only Windows' own DLLs: no Qt, no FloStudio, no Visual C++ runtime
            deps=$(dumpbin //dependents "$STUDIO" | tr -d '\r' | awk '/^ +[A-Za-z0-9_.-]+\.dll$/{print $1}' | tr 'A-Z' 'a-z' | sort -u)
            echo "::notice::Studio.exe uses: $(echo $deps)"
            echo "$deps" | grep -qx kernel32.dll || { echo "::error::could not read Studio.exe's DLLs"; exit 1; }
            bad=$(echo "$deps" | grep -E '^(qt6|flostudio|vcruntime|msvcp|concrt|ucrtbase)' || true)
            if [ -n "$bad" ]; then echo "::error::Studio.exe needs DLLs that don't ship: $(echo $bad)"; exit 1; fi
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            archs=$(lipo -archs "$STUDIO")
            minos=$(otool -l "$STUDIO" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "::notice::architectures: $archs; minimum macOS: $minos"
            [ "$minos" = "$MACOS_MIN" ] || { echo "::error::Studio needs macOS $minos, Qt $MACOS_MIN"; exit 1; }
            case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::not a universal binary: $archs"; exit 1;; esac
            # Only macOS's own libraries and frameworks
            bad=$(otool -L "$STUDIO" | awk '/^\t/{print $1}' | { grep -vE '^(/System/|/usr/lib/)' || true; } | sort -u)
            if [ -n "$bad" ]; then echo "::error::libraries that don't ship: $(echo $bad)"; exit 1; fi
            rpaths=$(find "$APP_DIR" -type f \( -perm -u+x -o -name '*.dylib' \) -exec otool -l {} \; 2>/dev/null \
                  | awk '/cmd LC_RPATH/{getline; getline; print $2}' | { grep '^/' || true; } | sort -u)
            if [ -n "$rpaths" ]; then echo "::error::rpaths outside the bundle: $(echo $rpaths)"; exit 1; fi
          fi

      # Without the Qt install's paths: PATH on Windows, and the plugin and
      # QML paths install-qt-action sets, so only what ships is used.
      - name: Smoke test (without the Qt install)
        timeout-minutes: 5
        run: |
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="/c/Windows/System32:/c/Windows:/usr/bin"; fi
          mkdir -p shots
          "$STUDIO" --smoke-test --screenshot shots/studio-$RUNNER_OS.png

      # Memory management: what Studio uses at the start, with every page and
      # tab opened, after it freed what is idle, and with everything opened
      # again (shown as notices on the run)
      - name: Memory test
        timeout-minutes: 5
        run: |
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH
          if [ "$RUNNER_OS" = "Windows" ]; then export PATH="/c/Windows/System32:/c/Windows:/usr/bin"; fi
          code=0
          "$STUDIO" --memory-test --demo app/demo/project.json > memory.txt 2>&1 || code=$?
          cat memory.txt
          while IFS= read -r line; do echo "::notice title=Memory ($RUNNER_OS)::$line"; done < <(grep '^memory' memory.txt || true)
          exit $code

      # Code signing (CODE_SIGNING.md) checks that Studio.exe says it is
      # FloCMS Studio, with Studio's version
      - name: Version information
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:APP_DIR" -Recurse -File -Include *.exe, *.dll)
          if ($files.Count -ne 1) { Write-Output "::error::expected Studio.exe alone, found $(($files | ForEach-Object Name) -join ', ')"; exit 1 }
          foreach ($f in $files) {
            $v = $f.VersionInfo
            if ($v.ProductName -ne 'FloCMS Studio' -or $v.ProductVersion -ne $env:VERSION -or $v.CompanyName -ne 'HostKurd') {
              Write-Output "::error::$($f.Name): product '$($v.ProductName)' $($v.ProductVersion) by '$($v.CompanyName)', not FloCMS Studio $env:VERSION by HostKurd"; exit 1
            }
          }
          Write-Output "::notice::version information: $(($files | ForEach-Object Name) -join ', ') say FloCMS Studio $env:VERSION"

      # The installer (WiX, installer/windows/): built, checked, then an
      # upgrade from an older build, the installed Studio's smoke test and an
      # uninstall that leaves nothing behind
      - name: Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: |
          installer/windows/build_msi.sh "$APP_DIR" "$VERSION" "FloCMS-Studio-$VERSION-x64.msi"
          installer/windows/build_msi.sh "$APP_DIR" 0.0.0 older.msi
          echo "::notice::installer: FloCMS-Studio-$VERSION-x64.msi $(( $(stat -c %s "FloCMS-Studio-$VERSION-x64.msi") / 1024 )) KiB"

      - name: Windows installer test
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: installer/windows/test_msi.ps1 -Msi "FloCMS-Studio-$env:VERSION-x64.msi" -Older older.msi -Version $env:VERSION

      - name: macOS disk image dry run
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "$APP_DIR" dist/LICENSE.txt dist/THIRD-PARTY-NOTICES.txt "$staging/"
          ln -s /Applications "$staging/Applications"
          dmg="FloCMS-Studio-$VERSION.dmg"
          hdiutil create -volname "FloCMS Studio" -srcfolder "$staging" -ov -format UDZO "$dmg" > /dev/null
          echo "::notice::disk image: $dmg $(( $(stat -f %z "$dmg") / 1024 )) KiB"
          # Move the build folder away, so the app can only use what is inside
          # it (the static Qt and its build are away already).
          mv build build-moved
          mnt="$RUNNER_TEMP/mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          "$mnt/FloCMS Studio.app/Contents/MacOS/FloCMS Studio" --smoke-test
          hdiutil detach "$mnt" > /dev/null
          mv build-moved build
          echo "::notice::disk image: mounted, smoke test passed from the image (build folder moved away)"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FloCMS-Studio-windows-portable
          path: dist/FloCMS-Studio/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FloCMS-Studio-windows-installer
          path: FloCMS-Studio-*-x64.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: FloCMS-Studio-macos
          path: FloCMS-Studio-*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs-${{ matrix.os }}
          path: |
            build.log
            build-static.log
            install-older.log
            install.log
            uninstall.log
            shots/
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          setup-python: false

      - name: Linux packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libsecret-1-dev ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # PHP and Composer for the Core tests (finding the tools, running
      # commands) and the real FloCMS project below.
      - name: PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, fileinfo, gd, openssl, curl, pdo, pdo_sqlite, pdo_mysql
          tools: composer
          coverage: none

      - name: Tests and smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .github/scripts/run_tests.sh build
          build/bin/flocms-studio --version
          build/bin/flocms-studio --smoke-test
          build/bin/flocms-studio --memory-test --demo app/demo/project.json | tee memory.txt
          while IFS= read -r line; do echo "::notice title=Memory (Linux)::$line"; done < <(grep '^memory' memory.txt || true)

      # Translated labels go through AppText.ui (the right-to-left mark), and
      # the translation files hold no direction marks or broken plurals
      - name: Label and translation checks
        run: |
          python tools/check_qml_labels.py
          python prototypes/rtl-check/check_ts.py app/i18n/studio_ar.ts app/i18n/studio_ckb.ts

      - name: Screenshots of every screen
        env:
          QT_QPA_PLATFORM: offscreen
        run: .github/scripts/screenshots.sh build/bin/flocms-studio shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore

      # A Linux build to try (D14: the Linux release comes after Windows
      # and macOS): an AppImage, and the same folder as a .tar.gz
      - name: Linux AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: .github/scripts/package_linux.sh build linux-dist

      - uses: actions/upload-artifact@v4
        with:
          name: FloCMS-Studio-linux
          path: linux-dist/
          if-no-files-found: error

      # Website + admin panel on the runner's MySQL (root/root)
      - name: Real FloCMS project
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -h127.0.0.1 -e "CREATE DATABASE studio_ci"
          .github/scripts/real_project.sh "$RUNNER_TEMP/site" mysql
          FLOSTUDIO_REAL_PROJECT="$RUNNER_TEMP/site" FLOSTUDIO_WIZARD_TESTS=1 .github/scripts/run_tests.sh build -R "tst_realproject|tst_studio" -V

  sanitizers:
    name: sanitizers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux_gcc_64
            leaks: 1
          - os: macos-14
            arch: clang_64
            leaks: 0 # LeakSanitizer is not available on macOS
    env:
      ASAN_OPTIONS: detect_leaks=${{ matrix.leaks }}:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.arch }}
          cache: true
          setup-python: false

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libsecret-1-dev ninja-build

      - name: macOS tools
        if: runner.os == 'macOS'
        run: python -m pip install -q ninja

      # PHP and Composer for the Core tests (finding the tools, running
      # commands) and the real FloCMS project below.
      - name: PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, fileinfo, gd, openssl, curl, pdo, pdo_sqlite, pdo_mysql
          tools: composer
          coverage: none

      - name: Build with sanitizers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFLOSTUDIO_SANITIZE=ON
          cmake --build build

      - name: Tests and smoke test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then export QT_QPA_PLATFORM=offscreen; app=build/bin/flocms-studio
          else app="build/bin/FloCMS Studio.app/Contents/MacOS/FloCMS Studio"; fi
          # Sanitizer reports are long; repeat their key lines as annotations.
          report() {
            grep -E "ERROR: AddressSanitizer|runtime error:|SUMMARY:|FAIL!|^warning: |warning\(s\)|^    #[0-4] " "$1" | head -25 | sed 's/^/::error::/'
          }
          set +e
          ctest --test-dir build --output-on-failure > ctest.log 2>&1; tests=$?
          cat ctest.log; [ $tests -eq 0 ] || report ctest.log
          "$app" --smoke-test > smoke.log 2>&1; smoke=$?
          cat smoke.log; [ $smoke -eq 0 ] || report smoke.log
          echo "::notice::tests exit $tests, smoke test exit $smoke"
          [ $tests -eq 0 ] && [ $smoke -eq 0 ]

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true
          setup-python: false

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang clang-tidy libgl1-mesa-dev libsecret-1-dev ninja-build

      - name: Build with Clang (for the generated headers and the compile database)
        env:
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: clang-tidy
        run: |
          clang-tidy --version
          python tools/run_clang_tidy.py build
