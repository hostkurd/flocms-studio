name: Installer try (temporary)
on:
  push:
    branches: [feat/release-signing]
    paths: ["installer/**", ".github/workflows/zz-installer-try.yml"]
permissions:
  contents: read
jobs:
  msi:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fake/sub
          cp /c/Windows/System32/whoami.exe fake/Studio.exe
          cp LICENSE fake/LICENSE.txt; cp LICENSE fake/THIRD-PARTY-NOTICES.txt; echo x > fake/sub/a.txt
          installer/windows/build_msi.sh fake 0.1.0 FloCMS-Studio-0.1.0-x64.msi
          installer/windows/build_msi.sh fake 0.0.0 older.msi
